<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Christmas Interactive</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
        }
        .test-result {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .pass { background: #4CAF50; }
        .fail { background: #f44336; }
        .info { background: #2196F3; }
        #container { 
            width: 400px; 
            height: 300px; 
            border: 2px solid #fff;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>🎄 Christmas Interactive - Dependency Test</h1>
    <div id="results"></div>
    <div id="container"></div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    
    <script>
        const results = document.getElementById('results');
        
        function addResult(message, status) {
            const div = document.createElement('div');
            div.className = `test-result ${status}`;
            div.textContent = message;
            results.appendChild(div);
        }

        // Test Three.js
        try {
            if (typeof THREE !== 'undefined') {
                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
                const renderer = new THREE.WebGLRenderer();
                renderer.setSize(400, 300);
                document.getElementById('container').appendChild(renderer.domElement);
                
                const geometry = new THREE.BoxGeometry();
                const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
                const cube = new THREE.Mesh(geometry, material);
                scene.add(cube);
                camera.position.z = 5;
                
                function animate() {
                    requestAnimationFrame(animate);
                    cube.rotation.x += 0.01;
                    cube.rotation.y += 0.01;
                    renderer.render(scene, camera);
                }
                animate();
                
                addResult('✓ Three.js loaded successfully and rendering', 'pass');
            } else {
                addResult('✗ Three.js not loaded', 'fail');
            }
        } catch (error) {
            addResult('✗ Three.js error: ' + error.message, 'fail');
        }

        // Test GSAP
        try {
            if (typeof gsap !== 'undefined') {
                const testDiv = document.createElement('div');
                gsap.to(testDiv, { duration: 1, x: 100 });
                addResult('✓ GSAP loaded successfully', 'pass');
            } else {
                addResult('✗ GSAP not loaded', 'fail');
            }
        } catch (error) {
            addResult('✗ GSAP error: ' + error.message, 'fail');
        }

        // Test Browser APIs
        addResult('ℹ Browser: ' + navigator.userAgent, 'info');
        
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            addResult('✓ Camera API available', 'pass');
        } else {
            addResult('✗ Camera API not available', 'fail');
        }

        if (document.fullscreenEnabled || document.webkitFullscreenEnabled) {
            addResult('✓ Fullscreen API available', 'pass');
        } else {
            addResult('✗ Fullscreen API not available', 'fail');
        }

        addResult('ℹ WebGL available: ' + (!!document.createElement('canvas').getContext('webgl')), 'info');
    </script>
</body>
</html>
